<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>create post</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
  <div id="pointer"></div>

  <nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container-fluid">

      <!-- Brand Logo -->
      <a class="navbar-brand d-flex align-items-center gap-2" href="welcome.html">
        <div class="logo-icon-box">
          <span class="logo-letter">C</span>
        </div>
        <span class="brand-text">CampusConnect</span>
      </a>

      <!-- Mobile Toggler -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Nav Links -->
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-2">
          <li class="nav-item">
            <a class="nav-link active" href="dashboard.html"><i class="bi bi-plus-lg"></i> Create Post</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="event.html"><i class="bi bi-calendar-event"></i> Create Event</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="study-partners.html"><i class="bi bi-people"></i> Find Study Partner</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="poll.html"><i class="bi bi-patch-question"></i> Polls</a>
          </li>
        </ul>

        <!-- Controls -->
        <div class="d-flex align-items-center gap-3 my-2 my-lg-0 ms-auto">

          <!-- Admin Panel Button -->
          <a href="adminpanel.html" id="admin-panel-btn" class="btn btn-sm btn-info d-none me-1">
            <i class="bi bi-shield-lock-fill"></i> Admin Panel
          </a>

          <!-- Single Fixed Notification Dropdown -->
          <div class="dropdown me-3">
            <button id="notifBtn" class="btn text-light position-relative p-1" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-bell fs-5"></i>
              <!-- Red Badge Count -->
              <span id="notifBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
                0
              </span>
            </button>

            <!-- Notification Dropdown Menu -->
            <div id="notifMenu" class="dropdown-menu dropdown-menu-end p-2 shadow-lg"
              style="width: 300px; max-height: 350px; overflow-y: auto; background-color: #111827; border: 1px solid #1f2937;">
              <h6 class="dropdown-header text-teal fw-bold border-bottom border-secondary pb-2 mb-2">Notifications</h6>
              <div id="notifListContainer">
                <p class="text-muted small text-center my-2">No notifications yet.</p>
              </div>
            </div>
          </div>

          <!-- Dynamic Theme Switch -->
          <div class="theme-switch-wrapper me-4">
            <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox">
            <label for="theme-toggle" class="theme-switch-label">
              <i class="bi bi-sun-fill sun-icon"></i>
              <i class="bi bi-moon-stars-fill moon-icon"></i>
              <span class="ball"></span>
            </label>
          </div>

          <!-- Profile Dropdown -->
          <div class="profile-dropdown position-relative">
            <!-- User Avatar / Profile Icon Button -->
            <div class="d-flex align-items-center gap-2 cursor-pointer" id="profileDropdownBtn">
              <div class="avatar-circle overflow-hidden d-flex align-items-center justify-content-center" id="avatarBox"
                style="width: 40px; height: 40px; border-radius: 50%; background-color: #0d9488;">
                <img id="userAvatarImg" src="" alt="Profile" class="w-100 h-100 object-fit-cover d-none">
                <span id="userInitialText" class="text-white fw-bold">U</span>
              </div>
              <span id="navUserName" class="text-light fw-medium d-none d-md-inline">User</span>
              <i class="bi bi-chevron-down text-light small"></i>
            </div>

            <!-- Dropdown Menu -->
            <div class="dropdown-popup custom-dropdown-menu p-2 shadow-lg rounded" id="profileMenu"
              style="display: none; position: absolute; right: 0; top: 50px; background-color: #111827; min-width: 200px; z-index: 1000; border: 1px solid #1f2937;">

              <!-- Hidden File Input for Image Upload -->
              <input type="file" id="profilePicInput" accept="image/*" class="d-none">

              <!-- Option 1: Upload Profile Picture -->
              <button class="dropdown-item d-flex align-items-center gap-2 text-light py-2 px-3 rounded hover-bg" id="uploadPicBtn">
                <i class="bi bi-camera text-teal"></i> Upload Profile Picture
              </button>

              <!-- Option 2: Go to Dashboard -->
              <a href="welcome.html" class="dropdown-item d-flex align-items-center gap-2 text-light py-2 px-3 rounded hover-bg">
                <i class="bi bi-speedometer2 text-teal"></i> Go to Your Dashboard
              </a>

              <hr class="dropdown-divider border-secondary my-1">

              <!-- Option 3: Logout -->
              <button class="dropdown-item d-flex align-items-center gap-2 text-danger py-2 px-3 rounded hover-bg" id="logoutBtn">
                <i class="bi bi-box-arrow-right"></i> Logout
              </button>
            </div>

          </div>

        </div>
      </div>

    </div>
  </nav>

  <div class="container ptCont mt-5 my-4" id="postContainer">
    <div class="row">
      <div class="col-sm-12 col-md-6 col-lg-4">
        <div class="card postcont p-3 m-2">
          <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" placeholder="add title name" />
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" rows="3" placeholder="add a post description"></textarea>
          </div>
          <div class="mb-3 d-flex images justify-content-around">
            <img class="bgImg" onclick="addImg('images/1.webp')" src="images/1.webp" alt="">
            <img class="bgImg" onclick="addImg('images/4.jpg')" src="images/4.jpg" alt="">
            <img class="bgImg" onclick="addImg('images/image 1.jpg')" src="images/image 1.jpg" alt="">
            <img class="bgImg" onclick="addImg('images/image 2.webp')" src="images/image 2.webp" alt="">
            <label class="btn btn-primary userimg" for="imgInput">
              <i class="bi bi-plus-lg me-1"></i>
            </label>
            <input type="file" class="d-none" id="imgInput" accept="image/*">
          </div>
          <div class="text-center mt-3">
            <img id="previewImg" class="img-thumbnail d-none"
              style="max-width:100%; max-height:150px; border-radius:10px;" alt="Preview">
          </div>

          <label class="form-label">Text Color</label>
          <div class="color-div d-flex flex-wrap justify-content-around">
            <div class="colorbox" style="background-color: #8d3e6d; width: 45px; height: 45px; border-radius: 12%;" onclick="applycolor(this)"></div>
            <div class="colorbox" style="background-color: #92534b; width: 45px; height: 45px; border-radius: 12%;" onclick="applycolor(this)"></div>
            <div class="colorbox" style="background-color: #16484e; width: 45px; height: 45px; border-radius: 12%;" onclick="applycolor(this)"></div>
            <div class="colorbox" style="background-color: #6d6735; width: 45px; height: 45px; border-radius: 12%;" onclick="applycolor(this)"></div>
            <div class="colorbox" style="background-color: #052721; width: 45px; height: 45px; border-radius: 12%;" onclick="applycolor(this)"></div>
          </div>
          <button id="postBtn" onclick="post()" type="submit" class="btn btn-primary ms-auto postBtn w-100 mt-3">
            Post
          </button>

        </div>
      </div>
      <div class="col-sm-12 col-md-6 col-lg-8">
        <div class="search-box m-2">
          <input class="form-control" type="search" id="searchInput" placeholder="Search posts..." oninput="searchPosts()" />
          <button class="search-btn" onclick="searchPosts()">
            <i class="bi bi-search"></i>
          </button>
        </div>
        <div id="posts" class="posts m-2"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="JS/app.js" type="module"></script>
</body>

</html>
