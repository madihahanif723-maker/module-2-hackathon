<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Events</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="CSS/event.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg custom-navbar sticky-top">
    <div class="container-fluid">

        <!-- Brand Logo -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <div class="logo-icon-box">
                <span class="logo-letter">C</span>
            </div>
            <span class="brand-text">CampusConnect</span>
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav Links -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-2">
                <li class="nav-item">
                    <a class="nav-link " href="dashboard.html">Create Post</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active " aria-current="page" href="event.html">Create Event</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="study-partners.html">Find Study Partner</a>
                </li>
            </ul>

            <!-- Controls -->
            <div class="d-flex align-items-center gap-3 my-2 my-lg-0 ms-auto">

                <!-- Admin Panel Button -->
                <a href="adminpanel.html" id="admin-panel-btn" class="btn btn-sm btn-info d-none me-1">
                    <i class="bi bi-shield-lock-fill"></i> Admin Panel
                </a>

                <!-- 🔔 NOTIFICATION DROPDOWN (NEW) -->
                <div class="dropdown">
                    <button class="btn btn-link text-white position-relative p-0 border-0" type="button" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-bell-fill fs-5"></i>
                        <span id="notifCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display: none; font-size: 0.65rem;">
                            0
                        </span>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow mt-2" aria-labelledby="notifDropdown" id="notificationsList" style="width: 300px; max-height: 380px; overflow-y: auto;">
                        <li class="dropdown-item text-muted text-center py-2">No new notifications</li>
                    </ul>
                </div>

                <!-- Dynamic Theme Switch -->
                <div class="theme-switch-wrapper">
                    <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox">
                    <label for="theme-toggle" class="theme-switch-label">
                        <i class="bi bi-sun-fill sun-icon"></i>
                        <i class="bi bi-moon-stars-fill moon-icon"></i>
                        <span class="ball"></span>
                    </label>
                </div>

                <!-- Profile Dropdown -->
                <div class="profile-dropdown" id="logoutBtn">
            <div class="avatar-circle" onclick="toggleProfileMenu()">
              <span id="userInitial">U</span>
            </div>

            <div class="dropdown-popup" id="profilePopup">
              <p class="user-email-text" id="dropdownEmail">user@mail.com</p>
              <hr class="dropdown-divider">
              <button class="dropdown-logout-btn" onclick="logout()">
                <i class="bi bi-box-arrow-right me-2"></i> Logout
              </button>
            </div>
          </div>

            </div>
        </div>

    </div>
</nav>

    <!-- Main Content Container -->
    <div class="container my-4">
        <div class="row g-4">

            <!-- Left Column: Create Form -->
            <div class="col-lg-4">
                <div class="event-card-form p-4 shadow-sm">
                    <h4 class="form-title mb-3">Create Event</h4>
                    <!-- Form submit action ko disable karke direct function link kiya -->
                    <form id="createEventForm" onsubmit="createEvent(event)">

                        <div class="mb-3">
                            <label class="form-label">Event Title</label>
                            <input type="text" id="title" class="form-control custom-input"
                                placeholder="e.g. Hackathon 2026" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="description" class="form-control custom-input" rows="3"
                                placeholder="Add event description..." required></textarea>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">Date</label>
                                <input type="date" id="eventDate" class="form-control custom-input" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Time</label>
                                <input type="time" id="eventTime" class="form-control custom-input" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" id="location" class="form-control custom-input"
                                placeholder="e.g. Main Auditorium / Zoom" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Banner Image</label>
                            <input type="file" id="imageFile" class="form-control custom-input" accept="image/*">
                        </div>

                        <button type="submit" id="eventBtn" class="btn btn-emerald w-100 mt-2">Publish Event</button>
                    </form>
                </div>
            </div>

            <!-- Right Column: List & Filters -->
            <div class="col-lg-8">

                <div class="d-flex flex-wrap gap-2 mb-4 justify-content-between align-items-center">
                    <div class="search-box position-relative flex-grow-1">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" id="searchInput" oninput="searchEvents()"
                            class="form-control custom-input ps-5" placeholder="Search events by title or location...">
                    </div>

                    <select class="form-select custom-input w-auto" id="filterEvents"
                        onchange="filterEvents(this.value)">
                        <option value="all">All Events</option>
                        <option value="joined">Joined by Me</option>
                    </select>
                </div>

                <div class="row g-3" id="eventsContainer">
                    <!-- Events will load dynamically -->
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Supabase CDN Script (Global Window object ke liye) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="JS/event.js" type="module"></script>
</body>

</html>
