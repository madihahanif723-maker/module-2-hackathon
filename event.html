<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Events</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="CSS/event.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg custom-navbar sticky-top">
        <div class="container-fluid">

            <!-- Brand Logo -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <div class="logo-icon-box">
                    <span class="logo-letter">C</span>
                </div>
                <span class="brand-text">CampusConnect</span>
            </a>

            <!-- Mobile Toggler -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Nav Links -->
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link " href="dashboard.html">Create Post</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active " aria-current="page" href="event.html">Create Event</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="study-partners.html">Find Study Partner</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link " href="poll.html">Polls</a>
                    </li>
                </ul>

                <!-- Controls -->
                <div class="d-flex align-items-center gap-3 my-2 my-lg-0 ms-auto">

                    <!-- Admin Panel Button -->
                    <a href="adminpanel.html" id="admin-panel-btn" class="btn btn-sm btn-info d-none me-1">
                        <i class="bi bi-shield-lock-fill"></i> Admin Panel
                    </a>

                    <div class="position-relative me-3">
                        <button id="notifBtn" class="btn text-light position-relative p-1" type="button">
                            <i class="bi bi-bell fs-5"></i>
                            <!-- Red Badge Count -->
                            <span id="notifBadge"
                                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
                                0
                            </span>
                        </button>

                        <!-- Notification Dropdown Menu -->
                        <div id="notifMenu" class="dropdown-menu dropdown-menu-end p-2 shadow-lg"
                            style="display: none; position: absolute; right: 0; top: 45px; width: 300px; max-height: 350px; overflow-y: auto; background-color: #111827; border: 1px solid #1f2937; z-index: 1050;">
                            <h6 class="dropdown-header text-emerald fw-bold border-bottom border-secondary pb-2 mb-2">
                                Notifications</h6>
                            <div id="notifListContainer">
                                <p class="text-muted small text-center my-2">No notifications yet.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic Theme Switch -->
                    <div class="theme-switch-wrapper">
                        <input type="checkbox" id="theme-toggle" class="theme-toggle-checkbox">
                        <label for="theme-toggle" class="theme-switch-label">
                            <i class="bi bi-sun-fill sun-icon"></i>
                            <i class="bi bi-moon-stars-fill moon-icon"></i>
                            <span class="ball"></span>
                        </label>
                    </div>

                    <!-- Profile Dropdown -->
                    <div class="profile-dropdown position-relative">
                        <!-- User Avatar / Profile Icon Button -->
                        <div class="d-flex align-items-center gap-2 cursor-pointer" id="profileDropdownBtn">
                            <div class="avatar-circle overflow-hidden d-flex align-items-center justify-content-center"
                                id="avatarBox"
                                style="width: 40px; height: 40px; border-radius: 50%; background-color: #0d9488;">
                                <img id="userAvatarImg" src="" alt="Profile"
                                    class="w-100 h-100 object-fit-cover d-none">
                                <span id="userInitialText" class="text-white fw-bold">U</span>
                            </div>
                            <span id="navUserName" class="text-light fw-medium d-none d-md-inline">User</span>
                            <i class="bi bi-chevron-down text-light small"></i>
                        </div>

                        <!-- Dropdown Menu -->
                        <div class="dropdown-popup custom-dropdown-menu p-2 shadow-lg rounded" id="profileMenu"
                            style="display: none; position: absolute; right: 0; top: 50px; background-color: #111827; min-width: 200px; z-index: 1000; border: 1px solid #1f2937;">

                            <!-- Hidden File Input for Image Upload -->
                            <input type="file" id="profilePicInput" accept="image/*" class="d-none">

                            <!-- Option 1: Upload Profile Picture -->
                            <button
                                class="dropdown-item d-flex align-items-center gap-2 text-light py-2 px-3 rounded hover-bg"
                                id="uploadPicBtn">
                                <i class="bi bi-camera text-teal"></i> Upload Profile Picture
                            </button>

                            <!-- Option 2: Go to Dashboard -->
                            <a href="welcome.html"
                                class="dropdown-item d-flex align-items-center gap-2 text-light py-2 px-3 rounded hover-bg">
                                <i class="bi bi-speedometer2 text-teal"></i> Go to Your Dashboard
                            </a>

                            <hr class="dropdown-divider border-secondary my-1">

                            <!-- Option 3: Logout -->
                            <button
                                class="dropdown-item d-flex align-items-center gap-2 text-danger py-2 px-3 rounded hover-bg"
                                id="logoutBtn">
                                <i class="bi bi-box-arrow-right"></i> Logout
                            </button>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container my-4">
        <div class="row g-4">

            <!-- Left Column: Create Form -->
            <div class="col-lg-4">
                <div class="event-card-form p-4 shadow-sm">
                    <h4 class="form-title mb-3">Create Event</h4>
                    <!-- Form submit action ko disable karke direct function link kiya -->
                    <form id="createEventForm" onsubmit="createEvent(event)">

                        <div class="mb-3">
                            <label class="form-label">Event Title</label>
                            <input type="text" id="title" class="form-control custom-input"
                                placeholder="e.g. Hackathon 2026" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="description" class="form-control custom-input" rows="3"
                                placeholder="Add event description..." required></textarea>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">Date</label>
                                <input type="date" id="eventDate" class="form-control custom-input" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Time</label>
                                <input type="time" id="eventTime" class="form-control custom-input" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" id="location" class="form-control custom-input"
                                placeholder="e.g. Main Auditorium / Zoom" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Banner Image</label>
                            <input type="file" id="imageFile" class="form-control custom-input" accept="image/*">
                        </div>

                        <button type="submit" id="eventBtn" class="btn btn-emerald w-100 mt-2">Publish Event</button>
                    </form>
                </div>
            </div>

            <!-- Right Column: List & Filters -->
            <div class="col-lg-8">

                <div class="d-flex flex-wrap gap-2 mb-4 justify-content-between align-items-center">
                    <div class="search-box position-relative flex-grow-1">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" id="searchInput" oninput="searchEvents()"
                            class="form-control custom-input ps-5" placeholder="Search events by title or location...">
                    </div>

                    <select class="form-select custom-input w-auto" id="filterEvents"
                        onchange="filterEvents(this.value)">
                        <option value="all">All Events</option>
                        <option value="joined">Joined by Me</option>
                    </select>
                </div>

                <div class="row g-3" id="eventsContainer">
                    <!-- Events will load dynamically -->
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Supabase CDN Script (Global Window object ke liye) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="JS/event.js" type="module"></script>
</body>

</html>
